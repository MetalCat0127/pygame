<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage Select</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            margin-top: 40px;
        }

        .stage-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 50px;
        }

        .stage-box {
            width: 200px;
            height: 120px;
            border: 2px solid #333;
            border-radius: 10px;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }

        .stage-box:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }

        #player-info {
            position: absolute;
            top: 20px;
            left: 20px; /* ← 左上に変更 */
            background: rgba(0,0,0,0.6);
            padding: 15px 20px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            width: 180px;
        }

        #player-info div {
            margin-bottom: 8px;
        }

        #perm-exp-left-display {
            opacity: 0.7;
        }

        #reset-data-btn {
            position: absolute;
            top: 20px;
            right: 20px; /* ← 右上に固定 */
            padding: 8px 12px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        #reset-data-btn:hover {
            background: #ff6666;
        }

        .continue-button {
            width: 300px;
            height: 200px;
            padding: 20px 0;
            margin: 0 auto;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            background-color: #ffcc00;
            border-radius: 12px;
            cursor: pointer;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }

        .hidden {
            display: none;
        }

    </style>
</head>
<body>

<h1>ステージ選択</h1>

<div id="player-info">
    <div id="perm-level-display"></div>
    <div id="perm-exp-left-display"></div>
    <div id="perm-stats-display"></div>
    <div id="perm-reroll-display"></div>
</div>

<button id="reset-data-btn">ローカルストレージ削除</button>


<div id="stage-container" class="stage-container">
    <div class="stage-box" onclick="selectStage('stage1')">Stage 1</div>
    <div class="stage-box" onclick="selectStage('stage2')">Stage 2</div>
    <div class="stage-box" onclick="selectStage('stage3')">Stage 3</div>
</div>

<div id="continue-button" class="hidden">途中から再開</div>

<script>
const defaultPlayerData = {
    perm_level: 1,
    perm_exp: 0,
    perm_next_exp: 1,
    perm_stats: { atk_bonus: 0, hp_bonus: 0 , reroll_bonus: 0},
    progress: {current_stage: 1, current_wave: 1 },
    temp_flg: 0
};

function loadPlayerData() {
    const raw = localStorage.getItem("playerData");

    if (!raw) {
        localStorage.setItem("playerData", JSON.stringify(defaultPlayerData));
        return defaultPlayerData;
    }

    return JSON.parse(raw);
}

function showPlayerInfo() {
    const player = loadPlayerData();

    // 永続レベル表示
    document.getElementById("perm-level-display").textContent =
        "あなたのレベル: " + player.perm_level;
    
    // 次のレベルまであと
    const expLeft = player.perm_next_exp - player.perm_exp;
    document.getElementById("perm-exp-left-display").textContent =
        "次のレベルまであと: " + expLeft;

    // 永続ステータス表示
    document.getElementById("perm-stats-display").textContent =
        "攻撃力 + " + player.perm_stats.atk_bonus +
        " / 体力 + " + player.perm_stats.hp_bonus;

    document.getElementById("perm-reroll-display").textContent =
        "追加リロール回数: " + player.perm_stats.reroll_bonus;
}

// データ削除ボタン
document.getElementById("reset-data-btn").addEventListener("click", () => {
    if (confirm("ローカルストレージのプレイヤーデータを削除しますか？")) {
        localStorage.removeItem("playerData");
        localStorage.removeItem("paused_data")
        alert("プレイヤーデータを削除しました。ページを再読み込みします。");
        location.reload();
    }
});

// ページ読み込み時に表示
showPlayerInfo();



function selectStage(stageName) {
    localStorage.setItem("selectedStage", stageName);
    location.href = "game.html";
}

//途中から再開
window.addEventListener("DOMContentLoaded", () => {
    const playerData = JSON.parse(localStorage.getItem("playerData"));
    const paused = JSON.parse(localStorage.getItem("paused_data"));

    const continueBtn = document.getElementById("continue-button");
    const stageContainer = document.getElementById("stage-container");

    // temp_flg が 1 → 中断データあり
    if (playerData.temp_flg === 1) {

        // 中断ボタンを表示
        continueBtn.classList.remove("hidden");

        // ステージ選択を非表示
        stageContainer.classList.add("hidden");

        // 中断ステージへ飛ぶ処理
        continueBtn.addEventListener("click", () => {
            const stageName = paused.progress.temp_stage;
            console.log("ステージ値：",stageName);
            stageName = "stage" + stageName;
            console.log("合体：",stageName);
            //selectStage(stageName);
        });

    } else {
        // 通常ステージ選択モード
        continueBtn.classList.add("hidden");
        stageContainer.classList.remove("hidden");
    }
});

function selectStage(stageName) {
    localStorage.setItem("selectedStage", stageName);
    location.href = "game.html";
}


</script>

</body>
</html>
