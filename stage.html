<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage Select</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: #f5f5f5;
        }

        h1 {
            margin-top: 40px;
        }

        .stage-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 40px;
        }

        .stage-box {
            width: 200px;
            height: 120px;
            border: 2px solid #333;
            border-radius: 10px;
            margin: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            background: white;
            transition: 0.2s;
        }

        .stage-box:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<h1>ステージ選択</h1>

// 選択したステージ番号を保存

<div id="perm-level-display" style="margin-top: 20px; font-size: 18px;"></div>

<div class="stage-container">
    <div class="stage-box" onclick="selectStage('stage1')">Stage 1</div>
    <div class="stage-box" onclick="selectStage('stage2')">Stage 2</div>
    <div class="stage-box" onclick="selectStage('stage3')">Stage 3</div>
</div>

<script>

const playerData = loadPlayerData();

// 永続レベルを表示
document.getElementById("perm-level-display").textContent =
    "永続レベル: " + playerData.perm_level;


const defaultPlayerData = {
    perm_level: 1,
    perm_exp: 0,
    perm_stats: { atk_bonus: 0, hp_bonus: 0 },
    perm_skills: {},
    progress: { cleared_stages: [], current_stage: 1, current_wave: 1 },
    temp_state: {
        temp_level: 1,
        temp_exp: 0,
        temp_stats: { atk_bonus: 0, hp_bonus: 0 },
        temp_skills: {}
    }
};

function loadPlayerData() {
    const raw = localStorage.getItem("playerData");

    if (!raw) {
        // ★ ローカルストレージに何もない → 初期データを作成
        localStorage.setItem("playerData", JSON.stringify(defaultPlayerData));
        return defaultPlayerData;
    }

    return JSON.parse(raw);
}


function selectStage(stageName) {
    localStorage.setItem("selectedStage", stageName);
    location.href = "game.html";
}

</script>

</body>
</html>
