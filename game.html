<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ← スクロール禁止 */
            height: 100%;
            font-family: sans-serif;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ddd;
            font-size: 20px;
            font-weight: bold;
            height: 60px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 60px - 140px); 
            /* 100vh - 上部60px - 下部140px */
        }

        /* 左側ステータス */
        #left-status {
            padding: 10px;
            width: 180px;
            box-sizing: border-box;
            font-size: 18px;
        }

        #exp-bar {
            width: 100%;
            height: 16px;
            background: #bbb;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        #exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /*メニューのやつ*/
        #menu {
            cursor: pointer;        /* 指カーソルにする */
            user-select: none;      /* 文字選択を防ぐ */

            border-radius: 6px;
            display: inline-block;  /* テキストのままより押しやすくなる */

            font-size: 20px;
            font-weight: bold;
        }

        /* メニューを押した後のやつ */
        .pause-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: rgba(80,80,80,0.8);
            transform: translate(-50%, -50%);
            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        /* 表示状態 */
        .pause-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* 中身のボックス */
        .pause-box {
            text-align: center;
            color: white;
            text-shadow: 0 0 10px black;

            font-size: 32px;
            font-weight: bold;

            /* gameOver と同じ雰囲気に寄せる */
            padding: 20px 40px;
        }

        /* ボタンの間隔を広げる */
        .pause-box button {
            display: block;
            width: 240px;
            margin: 20px auto;   /* ← 間隔を広げた */
            padding: 12px;
            font-size: 20px;
            cursor: pointer;

            border-radius: 8px;
            border: none;
        }

        /* メインエリア（敵）
        #main-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;

            max-width: 550px;
            margin-left: 150px;
            margin-right: auto;   
        }
        */
        #main-area{
            position: relative;
            width:100%;
            height:300px;
        }

        .enemy-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
            position: relative;
        }

        /* 下部サイコロエリア */

        #dice-wrapper {
            padding-top: 10px;
            position: relative;
            z-index: 5;
            padding-bottom: 60px;
        }

        #dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #eee;
            min-height: 120px;
            position: relative;
            z-index: 20;
        }

        #reroll-counter {
            position: absolute;
            z-index: 30;
            left: 200px; /* サイコロの左に固定 */
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
        }

        .dice-box {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
        }

        .dice-roll {
            animation: rollAnim 0.2s linear;
        }

        #damage-info {
            display: inline-block;
            font-size: 20px;
            color: #ff4444;
            font-weight: bold;
            white-space: nowrap;
        }

        @keyframes rollAnim {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(90deg) scale(0.9); }
            100% { transform: rotate(180deg) scale(1); }
        }

        /* 1体 → 中央 */
        .enemy-layout-1 #enemy-area {
            position: relative;
        }

        .enemy-layout-1 #enemy-area .enemy-box {
            position:absolute;
            left: 40%;
            top: 155px;
            transform: translate(-50%, -50%);
        }

        /* 2体 → 左右に離す（中央は空ける） */
        .enemy-layout-2 #enemy-area {
            position: relative;
        }

        .enemy-layout-2 #enemy-area .enemy-box:nth-child(1) {
            position: absolute;
            left: 25%;   /* 左サイコロの上あたり */
            top: 155px;
            transform: translate(-50%, -50%);
        }

        .enemy-layout-2 #enemy-area .enemy-box:nth-child(2) {
            position: absolute;
            left: 45%;   /* 右サイコロの上あたり */
            top: 155px;
            transform: translate(-50%, -50%);
        }

        /* 3体 → 左・中央・右に並べる */
        .enemy-layout-3 #enemy-area {
            position: relative;
        }

        .enemy-layout-3 #enemy-area .enemy-box:nth-child(1) {
            position: absolute;
            left: 20%;   /* 左サイコロの上 */
            top: 155px;
            transform: translate(-50%, -50%);
        }

        .enemy-layout-3 #enemy-area .enemy-box:nth-child(2) {
            position: absolute;
            left: 40%;   /* 中央サイコロの上 */
            top: 155px;
            transform: translate(-50%, -50%);
        }

        .enemy-layout-3 #enemy-area .enemy-box:nth-child(3) {
            position: absolute;
            left: 60%;   /* 右サイコロの上 */
            top: 155px;
            transform: translate(-50%, -50%);
        }

        .enemy-box {
            width: 140px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .enemy-hp-fill {
            height: 10px;
            background: #ff4444;
            width: 100%;
            border-radius: 4px;
        }

        .enemy-hp-area {
            width: 100%;
            margin-top: 6px;
            text-align: center;
        }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .hp-text {
            font-size: 14px;
            margin-top: 6px;
        }


        .enemy-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        #attack-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* ボタンとダメージ表示の間 */
            margin-top:20px;
            position: relative;
            z-index: 10;
        }

        #damage-info {
            position: absolute;
            top: -45px;   /* 攻撃ボタンと同じ高さに浮かせる */
            right: 360px;     /* 右寄せ */
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
            white-space: nowrap;
            z-index: 10;
        }


        #attack-button {
            position: absolute;
            top: -50px; /* サイコロの上に浮かせる高さ */
            left: 390px;
            transform: none;
            z-index: 10;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #ff6666;
            color: white;
            border: none;
            opacity: 0.5;
        }

        #attack-button.enabled {
            opacity: 1.0;
            cursor: pointer;
        }

        .enemy-target {
            position: absolute;
            text-align: center;
            top: -40px;
            left:50%;
            transform: translateX(-50%);
            color: red;
            font-weight: bold;
            display: none;
            z-index: 5;
        }
        .enemy-box.targeted .enemy-target {
            display: block;
        }

        .enemy-interval {
            position: absolute;
            top:170px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #de0c0c;
        }

        #player-hp-area {
            width: 160px;
            height: 20px;
            background-color: #444;
            border: 2px solid #222;
            border-radius: 6px;
            position: absolute;
            top: 360px;      /* ← サイコロ枠の上部 */
            left: 10px;    /* ← 左端 */
            overflow: hidden;
        }

        #player-hp-fill {
            height: 100%;
            width: 100%;
            background-color: #4caf50;
        }

        #player-hp-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        /*ここからは演出関連*/
        #wave-banner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 80px;
            background: rgba(80,80,80,0.8);
            transform: translate(-50%, -50%);

            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px black;
            text-align: center;

            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none; /* クリック無効化 */
            z-index: 999;
        }

        #wave-banner.show {
            opacity: 1;
        }

        .enemy-hit {
            animation: enemyHitFlash 0.15s linear;
        }

        @keyframes enemyHitFlash {
            0%   { filter: brightness(1); }
            50%  { filter: brightness(2.5); }
            100% { filter: brightness(1); }
        }

        .damage-popup {
            position: absolute;
            color: red;
            font-size: 32px;
            font-weight: bold;
            animation: damageFloat 0.8s ease-out;
            pointer-events: none;
        }

        @keyframes damageFloat {
            0%   { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }

        .slash-effect {
            position: absolute;
            width: 120px;
            height: 4px;
            background: white;
            transform: rotate(-20deg);
            animation: slashAnim 0.3s ease-out;
            pointer-events: none;
        }

        @keyframes slashAnim {
            0%   { opacity: 1; transform: translate(-20px, -20px) rotate(-20deg); }
            100% { opacity: 0; transform: translate(40px, 40px) rotate(-20deg); }
        }

        .enemy-box.fadeout {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #skill-select-container {
            position: fixed;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;

            display: flex;
            justify-content: center;   /* ← 中央寄せ */
            gap: 40px;                 /* ← カード間の余白 */
            width: auto;             /* ← 横幅を画面いっぱいに */
        }

        .skill-select {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
        }

        .skill-slot {
            width: 120px;
            height: 120px;
            background: #222;
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            text-align: center;
            justify-content: center;
            align-items: center;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .skill-slot:hover {
            transform: scale(1.05);
        }

        .skill-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 12px;
            color: #000;
        }

        .skill-detail {
            font-weight: 500;
            font-size: 14px;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        /*スキルのレア度ごとに色をつけるよ*/
        .skill-green {
            background: rgba(0, 255, 0, 0.25);
        }

        .skill-blue {
            background: rgba(0, 128, 255, 0.25);
        }

        .skill-purple {
            background: rgba(170, 0, 255, 0.25);
        }

        .skill-yellow {
            background: rgba(255, 255, 0, 0.25);
        }

        /*ここからはステージクリア時のcss*/
        #stageClearUI {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%; /* クリア画面なので少し高さを増やす */
            background: rgba(80,80,80,0.8);
            transform: translate(-50%, -50%);

            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px black;
            text-align: center;

            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none; /* wave と同じくクリック無効化 */
            z-index: 999;
        }

        #stageClearUI.show {
        opacity: 1;
        }

        /* 中のテキスト調整 */
        #stageClearUI .clear-title {
            margin-top: 10px;
        }

        #stageClearUI .clear-exp {
            font-size: 32px;
            margin-top: 10px;
        }

        /* ボタンは pointer-events を有効化する必要がある */
        #stageClearUI button {
            pointer-events: auto; /* ← これが重要 */
            margin-top: 15px;
            font-size: 24px;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
        }

        #stageClearUI button:hover {
            background: #45a049;
        }

        /*ここからはゲームオーバー時のcss*/
        #gameOverUI {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: rgba(80,80,80,0.8);
            transform: translate(-50%, -50%);

            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px black;
            text-align: center;

            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none; /* wave と同じくクリック無効化 */
            z-index: 999;
        }

        #gameOverUI.show {
        opacity: 1;
        }

        /* 中のテキスト調整 */
        #gameOverUI .gameover-text {
            margin-top: 10px;
        }

        #gameOverUI .clear-exp {
            font-size: 32px;
            margin-top: 10px;
        }

        /* ボタンは pointer-events を有効化する必要がある */
        #gameOverUI button {
            pointer-events: auto; /* ← これが重要 */
            margin-top: 15px;
            font-size: 24px;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: #400;
            color: white;
            cursor: pointer;
        }

        #gameOverUI button:hover {
            background: #400;
        }
    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div id="wave-display">1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <div id="pause-menu" class="hidden pause-overlay">
        <div class="pause-box">
            <h2>メニュー</h2>

            <button id="pause-resume">再開する</button>
            <button id="pause-save">中断する</button>
            <button id="pause-giveup">諦める</button>
        </div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
    <div id="left-status">
        <div id="level-display">レベル 1</div>
        <div id="exp-bar">
            <div id="exp-fill"></div>
        </div>
    </div>


        <!-- メインエリア（敵） -->
    <div id="main-area">
        <div id="enemy-area"></div>
    </div>

    <div id="skill-select-container" class="hidden">
        <div class="skill-slot" id="skill-slot-1"></div>
        <div class="skill-slot" id="skill-slot-2"></div>
        <div class="skill-slot" id="skill-slot-3"></div>
    </div>

    </div>

    <div id="wave-banner"></div>

    <div id="stageClearUI" class="hidden">
        <div class="clear-title">ステージクリア！</div>
        <div class="clear-exp"></div>
        <button id="returnButton">ステージ選択画面へ戻る</button>
    </div>

    <div id="gameOverUI" class="hidden result-overlay">
        <div class="result-box">
            <h1 class="gameover-text"></h1>
            <button id="gameOverReturnButton">ステージ選択画面に戻る</button>
        </div>
    </div>

    <div id="player-hp-area">
        <div id="player-hp-fill"></div>
        <div id="player-hp-text"></div>
    </div>

    <div id="dice-wrapper">

        <div id="dice-area">
            <div id="reroll-counter">残り 3 回</div>

            <img class="dice-box" id="dice-0" src="picture/dice1.png">
            <img class="dice-box" id="dice-1" src="picture/dice2.png">
            <img class="dice-box" id="dice-2" src="picture/dice3.png">
            <img class="dice-box" id="dice-3" src="picture/dice4.png">
            <img class="dice-box" id="dice-4" src="picture/dice5.png">
        </div>

        <button id="attack-button">攻撃</button>
        <div id="damage-info"></div>
    </div>


</body>
<script type="module">

import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.mjs";

let pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
});

window.pyodide = pyodide;   // ← windowに公開することで、いちいちロードしないでpythonを呼べる

// ▼ stage.html で選んだステージ名
const stageName = localStorage.getItem("selectedStage") || "stage1";
console.log("選択されたステージ:", stageName);

// ▼ fight.py を読み込む
const fightCode = await (await fetch("fight.py")).text();
const skillCode = await (await fetch("skill.py")).text();

try {
    await pyodide.runPythonAsync(fightCode);
    console.log("fight.py executed");
} catch (e) {
    console.error("fight.py error:", e);
}

try {
    await pyodide.runPythonAsync(skillCode);
    console.log("skill.py executed");
} catch (e) {
    console.error("skill.py error:", e);
}

// ▼ Pyodide の仮想ファイルに fight.py を書き込む
pyodide.FS.writeFile("fight.py", fightCode);
pyodide.FS.writeFile("skill.py", skillCode);

// ▼ start_game.py を読み込む
const code = await (await fetch("start_game.py")).text();


try {
    await pyodide.runPythonAsync(code);
    console.log("start_game.py executed");
} catch (e) {
    console.error("start_game.py error:", e);
}

// ▼ JSON を JS で取得
const stageData = await (await fetch(`get_stage/${stageName}.json`)).json();
// ▼ ローカルストレージから永続ステータスを取得
const playerData = JSON.parse(localStorage.getItem("playerData"));
const permAtk = playerData.perm_stats.atk_bonus;
const permHp  = playerData.perm_stats.hp_bonus;
const permReroll  = playerData.perm_stats.reroll_bonus;

// ▼ Python に渡す
pyodide.globals.set("stage_data", stageData);
pyodide.globals.set("perm_atk_bonus", permAtk);
pyodide.globals.set("perm_hp_bonus", permHp);
pyodide.globals.set("perm_reroll_bonus", permReroll);

// ▼ Python の関数を取得
//const init_game = pyodide.globals.get("init_game");

// ▼ 最後に init_game を呼ぶ
pyodide.runPython(`init_game("${stageName}")`);
//init_game(stageName);

</script>

window.startTurnJS = function(values) {
    // Pythonから来たサイコロの値を反映する
    animateAllDice(values);   // ← これでサイコロ画像が更新される
    recalcDamage();           // ← ダメージ計算も更新される
    enableTurnControls();     // ← 攻撃ボタンとサイコロを有効化

    const img = document.getElementById("dice-" + index);
    img.classList.add("dice-roll");

}

function recalcDamage() {
    const result = pyodide.runPython(`
from fight import calc_damage
calc_damage(${JSON.stringify(diceValues)})

    const [dmg, mult, role] = result.toJs();

    window.lastDamageValue = dmg;

window.rerollDice = function(index) {
    console.log("rerollDice called", index);

};

//ここでは敵の並び方を設定

function setEnemy(enemyCount) {
    const area = document.getElementById("enemy-area");
    area.innerHTML = "";

    const main = document.getElementById("main-area");
    main.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

    if (enemyCount === 1) main.classList.add("enemy-layout-1");
    else if (enemyCount === 2) main.classList.add("enemy-layout-2");
    else if (enemyCount === 3) main.classList.add("enemy-layout-3");

    // ★ 敵枠を生成する
    for (let i = 0; i < enemyCount; i++) {
        const box = document.createElement("div");
        box.className = "enemy-box";
        box.id = `enemy-${i}`;

        box.addEventListener("click", () => {
            window.currentTargetIndex = i;   // ← 攻撃対象の番号を保存
            highlightTarget(i);              // ← 見た目を変える
        });

        // 画像タグ（後で JSON の画像をセットする）
        const img = document.createElement("img");
        img.className = "enemy-img";
        img.id = `enemy-img-${i}`;
        img.src = ""; // 初期は空

        // ターゲット表示
        const target = document.createElement("div");
        target.className = "enemy-target";

        const hpArea = document.createElement("div");
        hpArea.className = "enemy-hp-area";

        const hpBar = document.createElement("div");
        hpBar.className = "hp-bar";

        // HPバー
        const hpFill = document.createElement("div");
        hpFill.className = "enemy-hp-fill";
        hpFill.id = `enemy-hp-fill-${i}`;

        hpBar.appendChild(hpFill);
        hpArea.appendChild(hpBar);

        // ★ HPテキスト（数字）
        const hpText = document.createElement("div");
        hpText.className = "hp-text";
        hpText.id = `enemy-hp-text-${i}`;
        hpText.textContent = "0 / 0";

        hpArea.appendChild(hpText);

        const intervalText = document.createElement("div");
        intervalText.className = "enemy-interval";
        intervalText.id = `enemy-interval-${i}`;
        intervalText.textContent = "";

        box.appendChild(target);
        box.appendChild(img);
        box.appendChild(hpArea);
        box.appendChild(intervalText);

        area.appendChild(box);
    }
}

//ここからはスキルの選択について
function startSkillSelect(count) {
    // ① 戦闘停止
    inputLocked = true;

    // ② 選ぶ回数を記録
    pendingSkillCount = count;

    // ③ Pythonにスキル候補を要求
    const skills = pyodide.runPython("get_skill_choices()");

    // ④ UIに表示
    showSkillSelectUI(skills);
}

function onSkillSelected(skillId) {
    pyodide.runPython(`apply_skill(${skillId})`);
    pendingSkillCount--;

    if (pendingSkillCount <= 0) {
        const container = document.getElementById("skill-select-container");
        inputLocked = false;
        container.classList.add("hidden");
        pyodide.runPython("start_wave()");  // ← ここで初めて次ウェーブ
    } else {
        const skills = pyodide.runPython("get_skill_choices()");
        showSkillSelectUI(skills);
    }
}

function showSkillSelectUI(skills) {
    const container = document.getElementById("skill-select-container");
    container.classList.remove("hidden");

    for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`skill-slot-${i+1}`);

        // ★ PyProxy → Map に変換（toJs() のデフォルト）
        const skill = skills[i].toJs();

        // Map なので get() を使う なんかjsオブジェクトにできなかった...mapで取れたからよし
        const id = skill.get("id");
        const name = skill.get("name");
        const type = skill.get("type");
        const value = skill.get("value");
        const rarity = skill.get("rarity");

        let titleText = id >= 100 ? "特殊スキル" : "ステータス強化";

        slot.classList.remove("skill-green", "skill-blue", "skill-purple", "skill-yellow");
        slot.classList.add(`skill-${rarity}`);

        slot.onclick = null;

        slot.innerHTML = `
            <div class="skill-title">${titleText}</div>
            <div class="skill-detail">${name}</div>
        `;

        slot.onclick = () => {
            onSkillSelected(id);
        };
    }
}

function onExpGained(amount) {
    if (inputLocked) return;
    let oldExp = currentExp;
    let newExp = currentExp + amount;

    // レベルアップしない場合
    if (newExp < expMax) {
        animateExpBar(oldExp, newExp);
        currentExp = newExp;
        return;
    }

    // --- レベルアップが起きる場合 ---
    // ① expMax まで伸ばす
    animateExpBar(oldExp, expMax);

    // ② レベルアップ演出
    showLevelUpEffect();

    // ③ 次のレベルの残り経験値を計算
    const overflow = newExp - expMax;

    // ④ バーを0に戻す（瞬間的に）
    setTimeout(() => {
        const bar = document.getElementById("exp-fill");
        bar.style.transition = "none";
        bar.style.width = "0%";

        // ⑤ 0 → overflow に伸ばす
        setTimeout(() => {
            animateExpBar(0, overflow);
        }, 50);
    }, 300);

    currentExp = overflow;
}

function animateExpBar(fromExp, toExp) {
    const bar = document.getElementById("exp-fill");

    const fromPercent = (fromExp / expMax) * 100;
    const toPercent = (toExp / expMax) * 100;

    bar.style.transition = "width 0.3s ease";
    bar.style.width = `${toPercent}%`;
}


//永続的なレベルの保存処理
function addPermanentExp(amount) {
    const data = JSON.parse(localStorage.getItem("playerData"));

    // 経験値加算
    data.perm_exp += amount;

    // レベルアップ判定
    while (data.perm_exp >= data.perm_next_exp) {
        data.perm_exp -= data.perm_next_exp;
        data.perm_level += 1;
        data.perm_next_exp += 1;  // 必要経験値が +1 ずつ増える

        // 永続ステータス上昇（レベルアップ時）
        data.perm_stats.atk_bonus += 5;
        data.perm_stats.hp_bonus += 10;

        if (data.perm_level % 10 === 0) {
            data.perm_stats.reroll_bonus += 1;
        }
    }

    // 保存
    localStorage.setItem("playerData", JSON.stringify(data));
}
