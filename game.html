<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ← スクロール禁止 */
            height: 100%;
            font-family: sans-serif;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ddd;
            font-size: 20px;
            font-weight: bold;
            height: 60px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 60px - 140px); 
            /* 100vh - 上部60px - 下部140px */
        }

        /* 左側ステータス */
        #left-status {
            padding: 10px;
            width: 180px;
            box-sizing: border-box;
            font-size: 18px;
        }

        #exp-bar {
            width: 100%;
            height: 16px;
            background: #bbb;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        #exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* メインエリア（敵） */
        #main-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            border:5px solid #333;

            max-width: 550px;   /* ← 敵エリアの幅を制限 */
            margin-left: 100px;
            margin-right: auto;   
        }


        .enemy-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
        }

        /* 下部サイコロエリア */

        #dice-wrapper {
            padding-top: 10px;
            position: relative;
            z-index: 5;
            padding-bottom: 60px;
        }

        #dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #eee;
            min-height: 120px;
            position: relative;
            z-index: 20;
        }

        #reroll-counter {
            position: absolute;
            z-index: 30;
            left: 230px; /* サイコロの左に固定 */
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
        }

        .dice-box {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
        }

        .dice-roll {
            animation: rollAnim 0.2s linear;
        }

        #damage-info {
            display: inline-block;
            font-size: 20px;
            color: #ff4444;
            font-weight: bold;
            white-space: nowrap;
        }

        @keyframes rollAnim {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(90deg) scale(0.9); }
            100% { transform: rotate(180deg) scale(1); }
        }

        /* 1体 → 中央 */
        .enemy-layout-1 #enemy-area {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        /* 2体 → 左右に離す（中央は空ける） */
        .enemy-layout-2 #enemy-area {
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        /* 3体 → 左・中央・右に並べる */
        .enemy-layout-3 #enemy-area {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .enemy-box {
            width: 140px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .enemy-hp-area {
            width: 100%;
            margin-top: 6px;
            text-align: center;
        }

        .hp-bar {
            width: 100%;
            height: 10px;
            background: #ccc;
            border-radius: 4px;
            overflow: hidden;
        }

        .hp-text {
            font-size: 14px;
            margin-top: 2px;
        }


        .enemy-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        #attack-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* ボタンとダメージ表示の間 */
            margin-top:20px;
            position: relative;
            z-index: 10;
        }

        #damage-info {
            position: absolute;
            top: -45px;   /* 攻撃ボタンと同じ高さに浮かせる */
            right: 400px;     /* 右寄せ */
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
            white-space: nowrap;
            z-index: 10;
        }


        #attack-button {
            position: absolute;
            top: -50px; /* サイコロの上に浮かせる高さ */
            left: 450px;
            transform: none;
            z-index: 10;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #ff6666;
            color: white;
            border: none;
            opacity: 0.5;
        }

        #attack-button.enabled {
            opacity: 1.0;
            cursor: pointer;
        }

        .enemy-target {
            text-align: center;
            color: red;
            font-weight: bold;
            display: none;
        }
        .enemy.targeted .enemy-target {
            display: block;
        }

    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div id="wave-display">1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
    <div id="left-status">
        <div id="level-display">レベル 1</div>
        <div id="exp-bar">
            <div id="exp-fill"></div>
        </div>
    </div>


        <!-- メインエリア（敵） -->
    <div id="main-area">
        <div id="enemy-area"></div>
    </div>

    </div>

    <div id="dice-wrapper">

        <div id="dice-area">
            <div id="reroll-counter">残り 3 回</div>

            <img class="dice-box" id="dice-0" src="picture/dice1.png">
            <img class="dice-box" id="dice-1" src="picture/dice2.png">
            <img class="dice-box" id="dice-2" src="picture/dice3.png">
            <img class="dice-box" id="dice-3" src="picture/dice4.png">
            <img class="dice-box" id="dice-4" src="picture/dice5.png">
        </div>

        <button id="attack-button">攻撃</button>
        <div id="damage-info"></div>
    </div>


</body>
<script type="module">

import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.mjs";

let pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
});

window.pyodide = pyodide;   // ← windowに公開することで、いちいちロードしないでpythonを呼べる

// ▼ stage.html で選んだステージ名
const stageName = localStorage.getItem("selectedStage") || "stage1";
console.log("選択されたステージ:", stageName);

// ▼ fight.py を読み込む
const fightCode = await (await fetch("fight.py")).text();

// ▼ Pyodide の仮想ファイルに fight.py を書き込む
pyodide.FS.writeFile("fight.py", fightCode);

// ▼ start_game.py を読み込む
const code = await (await fetch("start_game.py")).text();
pyodide.runPython(code);

// ▼ JSON を JS で取得
const stageData = await (await fetch(`get_stage/${stageName}.json`)).json();

// ▼ Python に渡す
pyodide.globals.set("stage_data", stageData);

// ▼ Python の関数を取得
const init_game = pyodide.globals.get("init_game");

// ▼ 最後に init_game を呼ぶ
init_game(stageName);

</script>


<script>

let diceFaces = [
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6]
];

let diceValues = [1,2,3,4,5];

let enemyHP = [];
let enemyMaxHP = [];

let rerollLeft = 3;

let targetIndex = -1; // -1 = 対象未選択

//pythonが関係している奴は大体window.イベント名(初期化は含まず)
window.register_events = () => {
    for (let i = 0; i < 5; i++) {
        document.getElementById("dice-" + i)
            .addEventListener("click", () => rerollDice(i));
    }

    //攻撃ボタンだyo
    document.getElementById("attack-button")
        .addEventListener("click", onAttackButton);
};

function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

function setLevel(lv) {
    document.getElementById("level-display").textContent = "レベル " + lv;
}

function setWave(w, max) {
    document.getElementById("wave-display").textContent = w + "/" + max;
}

function setExp(exp, expMax) {
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}

function setRerollMax(n) {
    rerollLeft = n;
    updateRerollCounter();
}

window.onAttackButton = function() {
    pyodide.runPython("on_attack_button()");
};

//サイコロ関係は以下

function rollDice(index) {
    const faces = diceFaces[index];
    const result = faces[Math.floor(Math.random() * faces.length)];
    diceValues[index] = result;
    const img = document.getElementById("dice-" + index);
    img.classList.add("dice-roll");
    setTimeout(() => img.classList.remove("dice-roll"), 200);
    return result;
}

function animateAllDice(values) {
    values = values.toJs();
    diceValues = values;

    for (let i = 0; i < diceValues.length; i++) {
        const img = document.getElementById("dice-" + i);

        // 出目を更新
        img.src = "picture/dice" + diceValues[i] + ".png";

        // アニメーション付与(回転するよ)
        img.classList.add("dice-roll");
        setTimeout(() => img.classList.remove("dice-roll"), 200);
    }
}

function recalcDamage() {
    const result = pyodide.runPython(`
from fight import calc_damage
calc_damage(${JSON.stringify(diceValues)})
    `);

    const [dmg, mult, role] = result.toJs();

    window.lastDamageValue = dmg;
    showDamageInfo(dmg, mult, role);
}

window.rerollDice = function(index) {
    console.log("rerollDice called", index);
    if (rerollLeft <= 0) return;

    rerollLeft--;
    updateRerollCounter();

    const result = rollDice(index);
    diceValues[index] = result;
    document.getElementById("dice-" + index).src =
        "picture/dice" + result + ".png";

    recalcDamage();
};

function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

function updateRerollCounter() {
    document.getElementById("reroll-counter").textContent =
        `残り ${rerollLeft} 回`;
}

//ここでは敵の並び方を設定

function setEnemy(enemyCount) {
    const area = document.getElementById("enemy-area");
    area.innerHTML = "";

    const main = document.getElementById("main-area");
    main.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

    if (enemyCount === 1) main.classList.add("enemy-layout-1");
    else if (enemyCount === 2) main.classList.add("enemy-layout-2");
    else if (enemyCount === 3) main.classList.add("enemy-layout-3");

    // ★ 敵枠を生成する
    for (let i = 0; i < enemyCount; i++) {
        const box = document.createElement("div");
        box.className = "enemy-box";
        box.id = `enemy-${i}`;

        // 画像タグ（後で JSON の画像をセットする）
        const img = document.createElement("img");
        img.className = "enemy-img";
        img.id = `enemy-img-${i}`;
        img.src = ""; // 初期は空

        // ターゲット表示
        const target = document.createElement("div");
        target.className = "enemy-target";

        // HPバー
        const hpFill = document.createElement("div");
        hpFill.className = "enemy-hp-fill";
        hpFill.id = `enemy-hp-fill-${i}`;

        box.appendChild(img);
        box.appendChild(target);
        box.appendChild(hpFill);

        area.appendChild(box);
    }
}


window.setEnemyCount = function(count) {
    setEnemy(count);  // ← 敵の枠を作る（今まで通り）

    window.enemyCount = count;

    // ★ 敵クリックイベントを登録する
    for (let i = 0; i < count; i++) {
        const el = document.getElementById(`enemy-${i}`);
        el.addEventListener("click", () => {
            window.currentTargetIndex = i;
            highlightTarget(i);
        });
    }
};

//レベル関係は以下

function addExp(amount) {
    exp += amount;
    if (exp >= expMax) {
        exp -= expMax;
        level++;
        document.getElementById("level-display").textContent = "レベル " + level;
    }
document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}

window.setEnemyHP = function(hpList) {
    enemyHP = hpList;

    for (let i = 0; i < hpList.length; i++) {
        const hp = hpList[i];
        const maxHp = enemyMaxHP[i];

        const fill = document.getElementById(`enemy-hp-fill-${i}`);
        if (!fill) continue;

        const ratio = hp / maxHp;
        fill.style.width = (ratio * 100) + "%";
    }
};

window.setEnemyImages = function(imgList) {
    for (let i = 0; i < imgList.length; i++) {
        const img = document.getElementById(`enemy-img-${i}`);
        if (img) img.src = imgList[i];
    }
};

function updateEnemyHPUI() {
    for (let i = 0; i < enemyHP.length; i++) {
        const percent = (enemyHP[i] / enemyMaxHP[i]) * 100;
        document.getElementById(`enemy-hp-${i}`).style.width = percent + "%";

        document.getElementById(`enemy-hp-text-${i}`).textContent =
            `${enemyHP[i]} / ${enemyMaxHP[i]}`;
    }
}

//以下は攻撃系

function showDamageInfo(dmg, mult, role) {
    const info = document.getElementById("damage-info");
    info.textContent = `${dmg} ダメージ (${mult}倍 - ${role})`;
}

window.getDamageValue = function() {
    return lastDamageValue; // recalcDamageでセットしておく
};

//ターゲットの指定
window.currentTargetIndex = -1;

window.getTargetIndex = function() {
    return window.currentTargetIndex ?? -1;
};

//ターゲットの切り替え
function highlightTarget(index) {
    for (let i = 0; i < enemyCount; i++) {
        const el = document.getElementById(`enemy-${i}`);
        const targetText = el.querySelector(".enemy-target");

        if (i === index) {
            el.classList.add("targeted");
            targetText.textContent = "↓↓ target! ↓↓";
        } else {
            el.classList.remove("targeted");
            targetText.textContent = "";
        }
    }
}

//UIの有効化
window.enableTurnControls = function() {
    const attack = document.getElementById("attack-button");
    attack.disabled = false;
    attack.classList.add("enabled");

    // サイコロも有効化
    for (let i = 0; i < 5; i++) {
        document.getElementById("dice-" + i).classList.remove("disabled");
    }
};

window.disableTurnControls = function() {
    const attack = document.getElementById("attack-button");
    attack.disabled = true;
    attack.classList.remove("enabled");

    for (let i = 0; i < 5; i++) {
        document.getElementById("dice-" + i).classList.add("disabled");
    }
};

//ダメージ更新とか
window.startTurnJS = function(diceValues) {
    // サイコロ画像更新
    animateAllDice(diceValues);

    // ダメージ計算（ここで lastDamageValue がセットされる）
    recalcDamage();

    // ターン開始後に操作可能にする
    enableTurnControls();
};

</script>
</html>
