<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ← スクロール禁止 */
            height: 100%;
            font-family: sans-serif;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ddd;
            font-size: 20px;
            font-weight: bold;
            height: 60px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 60px - 140px); 
            /* 100vh - 上部60px - 下部140px */
        }

        /* 左側ステータス */
        #left-status {
            padding: 10px;
            width: 180px;
            box-sizing: border-box;
            font-size: 18px;
        }

        #exp-bar {
            width: 100%;
            height: 16px;
            background: #bbb;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        #exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* メインエリア（敵） */
        #main-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            border:5px solid #333;

            max-width: 600px;   /* ← 敵エリアの幅を制限 */
            margin: auto;   
        }


        .enemy-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
        }

        /* 下部サイコロエリア */

        #dice-wrapper {
            display: block;
            justify-content: center; /* サイコロ全体を中央に */
            padding-top: 10px;
            position: relative;
            z-index: 5;
        }

        #dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #eee;
            min-height: 120px;
            position: relative;
            z-index: 1;
        }

        #reroll-counter {
            position: absolute;
            z-index: 8;
            left: -120px; /* サイコロの左に固定 */
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
        }

        .dice-box {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
        }

        .dice-roll {
            animation: rollAnim 0.2s linear;
        }

        #damage-info {
            display: inline-block;
            font-size: 20px;
            color: #ff4444;
            font-weight: bold;
            white-space: nowrap;
        }

        @keyframes rollAnim {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(90deg) scale(0.9); }
            100% { transform: rotate(180deg) scale(1); }
        }

        .enemy-layout-1 {
            justify-content: center;
        }
        
        .enemy-layout-2 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* 3分割 */
            width: 100%;
        }

        .enemy-layout-2 .enemy-box:nth-child(1) {
            grid-column: 1; /* 左 */
        }

        .enemy-layout-2 .enemy-box:nth-child(2) {
            grid-column: 3; /* 右 */
        }

        .enemy-layout-3 {
            justify-content: space-between;
        }

        .enemy-box {
            width: 120px;
            text-align: center;
        }

        .enemy-box {
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .enemy-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .enemy-hp-area {
            width: 100%;
            margin-top: 6px;
            text-align: center;
        }

        .hp-text {
            font-size: 14px;
            margin-top: 2px;
        }

        #attack-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* ボタンとダメージ表示の間 */
            margin-top:20px;
            position: relative;
            z-index: 10;
        }

        #damage-info {
            display: inline-block;
            font-size: 20px;
            font-weight: bold;
            color: #ff4444;
            white-space: nowrap;
        }

        #attack-button {
            position: absolute;
            top: -50px; /* サイコロの上に浮かせる高さ */
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 20px;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #ff6666;
            color: white;
            border: none;
            opacity: 0.5;
        }

        #attack-button.enabled {
            opacity: 1.0;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div id="wave-display">1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
    <div id="left-status">
        <div id="level-display">レベル 1</div>
        <div id="exp-bar">
            <div id="exp-fill"></div>
        </div>
    </div>


        <!-- メインエリア（敵） -->
    <div id="main-area">
        <div id="enemy-area"></div>
    </div>

    </div>

    <div id="attack-row">
        <span id="damage-info"></span>
    </div>

    <div id="dice-wrapper">
        <button id="attack-button" onclick="onAttackButton()" disabled>攻撃</button>

        <div id="dice-area">
            <div id="reroll-counter">残り 3 回</div>

            <img class="dice-box" id="dice-0" src="picture/dice1.png" onclick="rerollDice(0)">
            <img class="dice-box" id="dice-1" src="picture/dice2.png" onclick="rerollDice(1)">
            <img class="dice-box" id="dice-2" src="picture/dice3.png" onclick="rerollDice(2)">
            <img class="dice-box" id="dice-3" src="picture/dice4.png" onclick="rerollDice(3)">
            <img class="dice-box" id="dice-4" src="picture/dice5.png" onclick="rerollDice(4)">
        </div>
    </div>


</body>
<script type="module">

import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.mjs";

let pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
});

// ▼ stage.html で選んだステージ名
const stageName = localStorage.getItem("selectedStage") || "stage1";
console.log("選択されたステージ:", stageName);

// ▼ fight.py を読み込む
const fightCode = await (await fetch("fight.py")).text();

// ▼ Pyodide の仮想ファイルに fight.py を書き込む
pyodide.FS.writeFile("fight.py", fightCode);

// ▼ start_game.py を読み込む
const code = await (await fetch("start_game.py")).text();
pyodide.runPython(code);



// ▼ JSON を JS で取得
const stageData = await (await fetch(`get_stage/${stageName}.json`)).json();

// ▼ Python に渡す（ここが重要）
pyodide.globals.set("stage_data", stageData);

// ▼ Python の関数を取得
const init_game = pyodide.globals.get("init_game");

// ▼ 最後に init_game を呼ぶ
init_game(stageName);
</script>


<script>

let diceFaces = [
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6]
];

let diceValues = [1,2,3,4,5];

let enemyHP = [];
let enemyMaxHP = [];

let rerollLeft = 3;

let targetIndex = -1; // -1 = 対象未選択

function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

function setLevel(lv) {
    document.getElementById("level-display").textContent = "レベル " + lv;
}

function setWave(w, max) {
    document.getElementById("wave-display").textContent = w + "/" + max;
}

function setEnemyCount(n) {
    setEnemy(n);
}

function setExp(exp, expMax) {
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}

function setRerollMax(n) {
    rerollLeft = n;
    updateRerollCounter();
}

function onAttackButton() {
    pyodide.runPython("on_attack_button()");
}

//サイコロ関係は以下

function rollDice(index) {
    const faces = diceFaces[index];
    const result = faces[Math.floor(Math.random() * faces.length)];
    diceValues[index] = result;
    const img = document.getElementById("dice-" + index);
    img.classList.add("dice-roll");
    setTimeout(() => img.classList.remove("dice-roll"), 200);
    return result;
}

function rerollDice(index) {
    if (rerollLeft <= 0) return;

    rerollLeft--;
    updateRerollCounter();

    const result = rollDice(index);
    document.getElementById("dice-" + index).src = "picture/dice" + result + ".png";
}

function animateAllDice(values) {
    diceValues = values;

    for (let i = 0; i < diceValues.length; i++) {
        const img = document.getElementById("dice-" + i);

        // 出目を更新
        img.src = "picture/dice" + diceValues[i] + ".png";

        // アニメーション付与
        img.classList.add("dice-roll");
        setTimeout(() => img.classList.remove("dice-roll"), 200);
    }
}


function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

function updateRerollCounter() {
    document.getElementById("reroll-counter").textContent =
        `残り ${rerollLeft} 回`;
}

//ここでは敵の並び方を設定

function setEnemy(enemyCount) {
    const area = document.getElementById("main-area");

    area.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

    if (enemyCount === 1) {
        area.classList.add("enemy-layout-1");
    } else if (enemyCount === 2) {
        area.classList.add("enemy-layout-2");
    } else if (enemyCount === 3) {
        area.classList.add("enemy-layout-3");
    }
}

//レベル関係は以下

function addExp(amount) {
    exp += amount;
    if (exp >= expMax) {
        exp -= expMax;
        level++;
        document.getElementById("level-display").textContent = "レベル " + level;
    }
document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}

function setEnemyHP(hpList) {
    enemyHP = hpList;
    enemyMaxHP = [...hpList];
    renderEnemyUI();
}


function renderEnemyUI() {
    const area = document.getElementById("main-area");
    area.innerHTML = ""; // 初期化

    for (let i = 0; i < enemyHP.length; i++) {
        const box = document.createElement("div");
        box.className = "enemy-box";

        box.innerHTML = `
            <img class="enemy-img" src="picture/enemy${i+1}.png">

            <div class="enemy-hp-area">
                <div class="hp-bar">
                    <div class="hp-fill" id="enemy-hp-${i}"></div>
                </div>
                    <div class="hp-text" id="enemy-hp-text-${i}">${enemyHP[i]} / ${enemyMaxHP[i]}</div>
            </div>
        `;


    area.appendChild(box);
}

updateEnemyHPUI();
setEnemy(enemyHP.length);
}


function updateEnemyHPUI() {
    for (let i = 0; i < enemyHP.length; i++) {
        const percent = (enemyHP[i] / enemyMaxHP[i]) * 100;
        document.getElementById(`enemy-hp-${i}`).style.width = percent + "%";

        document.getElementById(`enemy-hp-text-${i}`).textContent =
            `${enemyHP[i]} / ${enemyMaxHP[i]}`;
    }
}

//以下は攻撃系

function showDamageInfo(dmg, mult, role) {
    const info = document.getElementById("damage-info");
    info.textContent = `${dmg} ダメージ (${mult}倍 - ${role})`;
}

</script>
</html>
