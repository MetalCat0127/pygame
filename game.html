<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ← スクロール禁止 */
            height: 100%;
            font-family: sans-serif;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ddd;
            font-size: 20px;
            font-weight: bold;
            height: 60px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 60px - 140px); 
            /* 100vh - 上部60px - 下部140px */
        }

        /* 左側ステータス */
        #left-status {
            padding: 10px;
            width: 180px;
            box-sizing: border-box;
            font-size: 18px;
        }

        #exp-bar {
            width: 100%;
            height: 16px;
            background: #bbb;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        #exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* メインエリア（敵） */
        #main-area {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;

            max-width: 500px;   
            margin: 0 auto;     /* ← 中央寄せ */
        }


        .enemy-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
        }

        /* 下部サイコロエリア */
        #dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #eee;
            height: 140px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        .dice-box {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .enemy-layout-1 {
            justify-content: center;
        }
        
        .enemy-layout-2 {
            justify-content: space-between;
        }

        .enemy-layout-3 {
            justify-content: space-between;
        }

        .enemy-box {
            width: 120px;
            text-align: center;
        }

        .enemy-box {
            width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .enemy-img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .enemy-hp-area {
            width: 100%;
            margin-top: 6px;
            text-align: center;
        }

        .hp-text {
            font-size: 14px;
            margin-top: 2px;
        }

    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div id="wave-display">1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
    <div id="left-status">
        <div id="level-display">レベル 1</div>
        <div id="exp-bar">
            <div id="exp-fill"></div>
        </div>
    </div>


        <!-- メインエリア（敵） -->
    <div id="main-area">
        <div id="enemy-area"></div>
    </div>

    </div>

    <!-- 下部サイコロ -->
    <div id="dice-area">
        <img class="dice-box" id="dice-0" onclick="rerollDice(0)" src="picture/dice1.png">
        <img class="dice-box" id="dice-1" onclick="rerollDice(1)" src="picture/dice2.png">
        <img class="dice-box" id="dice-2" onclick="rerollDice(2)" src="picture/dice3.png">
        <img class="dice-box" id="dice-3" onclick="rerollDice(3)" src="picture/dice4.png">
        <img class="dice-box" id="dice-4" onclick="rerollDice(4)" src="picture/dice5.png">
    </div>

</body>
<script type="module">
import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.mjs";

let pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
});

// ▼ stage.html で選んだステージ名
const stageName = localStorage.getItem("selectedStage") || "stage1";
console.log("選択されたステージ:", stageName);

// ▼ start_game.py を読み込んで実行（globals 指定なし）
const code = await (await fetch("start_game.py")).text();
pyodide.runPython(code);

// ▼ JSON を JS で取得
const stageData = await (await fetch(`get_stage/${stageName}.json`)).json();

// ▼ Python に渡す（ここが重要）
pyodide.globals.set("stage_data", stageData);

// ▼ Python の関数を取得
const init_game = pyodide.globals.get("init_game");

// ▼ 最後に init_game を呼ぶ
init_game(stageName);
</script>


<script>

let diceFaces = [
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6]
];

let diceValues = [1,2,3,4,5];

let enemyHP = [];
let enemyMaxHP = [];

function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

function setLevel(lv) {
    document.getElementById("level-display").textContent = "レベル " + lv;
}

function setWave(w, max) {
    document.getElementById("wave-display").textContent = w + "/" + max;
}

function setEnemyCount(n) {
    setEnemy(n);
}

function setExp(exp, expMax) {
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}


//サイコロ関係は以下

function rollDice(index) {
    const faces = diceFaces[index];
    const result = faces[Math.floor(Math.random() * faces.length)];
    diceValues[index] = result;
    return result;
}

function rerollDice(index) {
    const result = rollDice(index);
    document.getElementById("dice-" + index).src = "picture/dice" + result + ".png";
}

function updateDiceUI() {
    for (let i = 0; i < diceValues.length; i++) {
        const value = diceValues[i];
        document.getElementById("dice-" + i).src = "picture/dice" + value + ".png";
    }
}

function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

//ここでは敵の並び方を設定

function setEnemy(enemyCount) {
    const area = document.getElementById("main-area");

    area.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

    if (enemyCount === 1) {
        area.classList.add("enemy-layout-1");
    } else if (enemyCount === 2) {
        area.classList.add("enemy-layout-2");
    } else if (enemyCount === 3) {
        area.classList.add("enemy-layout-3");
    }
}

//レベル関係は以下

function addExp(amount) {
    exp += amount;
    if (exp >= expMax) {
        exp -= expMax;
        level++;
        document.getElementById("level-display").textContent = "レベル " + level;
    }
document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}

function setEnemyHP(hpList) {
    enemyHP = hpList;
    enemyMaxHP = [...hpList];
    renderEnemyUI();
}


function renderEnemyUI() {
    const area = document.getElementById("main-area");
    area.innerHTML = ""; // 初期化

    for (let i = 0; i < enemyHP.length; i++) {
        const box = document.createElement("div");
        box.className = "enemy-box";

        box.innerHTML = `
            <img class="enemy-img" src="picture/enemy${i+1}.png">

            <div class="enemy-hp-area">
                <div class="hp-bar">
                    <div class="hp-fill" id="enemy-hp-${i}"></div>
                </div>
                    <div class="hp-text" id="enemy-hp-text-${i}">${enemyHP[i]} / ${enemyMaxHP[i]}</div>
            </div>
        `;


    area.appendChild(box);
}

updateEnemyHPUI();
setEnemy(enemyHP.length);
}


function updateEnemyHPUI() {
    for (let i = 0; i < enemyHP.length; i++) {
        const percent = (enemyHP[i] / enemyMaxHP[i]) * 100;
        document.getElementById(`enemy-hp-${i}`).style.width = percent + "%";

        document.getElementById(`enemy-hp-text-${i}`).textContent =
            `${enemyHP[i]} / ${enemyMaxHP[i]}`;
    }
}


</script>
</html>
