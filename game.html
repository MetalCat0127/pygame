<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #f0f0f0;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #ddd;
            font-size: 24px;
            font-weight: bold;
        }

        #wave {
            display: flex;
            gap: 10px;
        }

        /* 左側ステータス */
        #left-status {
            padding: 20px;
            width: 200px;
        }

        #exp-bar {
            width: 100%;
            height: 20px;
            background: #bbb;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        #exp-fill {
            width: 40%; /* 仮の値 */
            height: 100%;
            background: #4caf50;
        }

        /* メインエリア */
        #main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
        }

        .enemy-box {
            width: 200px;
            height: 200px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            border-radius: 10px;
        }

        /* 下部サイコロエリア */
        #dice-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            background: #eee;
        }

        .dice-box {
            width: 120px;
            height: 120px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 80px);
        }
    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div>1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
        <div id="left-status">
            <div>レベル</div>
            <div id="exp-bar">
                <div id="exp-fill"></div>
            </div>
        </div>

        <!-- メインエリア（敵） -->
        <div id="main-area">
            <div class="enemy-box">敵1</div>
            <div class="enemy-box">敵2</div>
        </div>

    </div>

    <!-- 下部サイコロ -->
    <div id="dice-area">
        <div class="dice-box">サイコロ1</div>
        <div class="dice-box">サイコロ2</div>
        <div class="dice-box">サイコロ3</div>
        <div class="dice-box">サイコロ4</div>
        <div class="dice-box">サイコロ5</div>
    </div>

</body>
</html>
