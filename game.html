<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>
    <link rel="stylesheet" href="game_style.css">
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div id="wave-display">1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!--これはメニューを押したときのUI-->
    <div id="pause-menu" class="hidden pause-overlay">
        <div class="pause-box">
            <h2>メニュー</h2>

            <button id="pause-resume">再開する</button>
            <button id="pause-save">中断する</button>
            <button id="pause-giveup">諦める</button>
        </div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
    <div id="left-status">
        <div id="level-display">レベル 1</div>
        <div id="exp-bar">
            <div id="exp-fill"></div>
        </div>
    </div>


        <!-- メインエリア（敵） -->
    <div id="main-area">
        <div id="enemy-area"></div>
    </div>

    <div id="skill-select-container" class="hidden">
        <div class="skill-slot" id="skill-slot-1"></div>
        <div class="skill-slot" id="skill-slot-2"></div>
        <div class="skill-slot" id="skill-slot-3"></div>
    </div>

    </div>

    <!--これはウェーブ開始時のUI-->
    <div id="wave-banner"></div>

    <!--これはステージをクリアした時のUI-->
    <div id="stageClearUI" class="hidden">
        <div class="clear-title">ステージクリア！</div>
        <div class="clear-exp"></div>
        <button id="returnButton">ステージ選択画面へ戻る</button>
    </div>

    <!--これはゲームオーバー時のUI-->
    <div id="gameOverUI" class="hidden result-overlay">
        <div class="result-box">
            <h1 class="gameover-text"></h1>
            <button id="gameOverReturnButton">ステージ選択画面に戻る</button>
        </div>
    </div>

    <!--これはプレイヤーのHPのUI-->
    <div id="player-hp-area">
        <div id="player-hp-fill"></div>
        <div id="player-hp-text"></div>
    </div>

    <!--これはサイコロと攻撃ボタンのUI-->
    <div id="dice-wrapper">

        <div id="dice-area">
            <div id="reroll-counter">残り 3 回</div>

            <img class="dice-box" id="dice-0" src="picture/dice1.png">
            <img class="dice-box" id="dice-1" src="picture/dice2.png">
            <img class="dice-box" id="dice-2" src="picture/dice3.png">
            <img class="dice-box" id="dice-3" src="picture/dice4.png">
            <img class="dice-box" id="dice-4" src="picture/dice5.png">
        </div>

        <button id="attack-button">攻撃</button>
        <div id="damage-info"></div>
    </div>


</body>
<!--これはgame.htmlに遷移したときに行われるpyodideの処理。-->
<!--ここでpyodideに.pyの内容を書き込んでいるので少し処理が長い-->
<script type="module">

import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.mjs";

let pyodide = await loadPyodide({
    indexURL: "https://cdn.jsdelivr.net/pyodide/v0.24.1/full/"
});

window.pyodide = pyodide;   // ← windowに公開することで、いちいちロードしないでpythonを呼べる

// ▼ stage.html で選んだステージ名
const stageName = localStorage.getItem("selectedStage") || "stage1";
console.log("選択されたステージ:", stageName);

// ▼ fight.py を読み込む
const fightCode = await (await fetch("fight.py")).text();
const skillCode = await (await fetch("skill.py")).text();

try {
    await pyodide.runPythonAsync(fightCode);
    console.log("fight.py executed");
} catch (e) {
    console.error("fight.py error:", e);
}

try {
    await pyodide.runPythonAsync(skillCode);
    console.log("skill.py executed");
} catch (e) {
    console.error("skill.py error:", e);
}

// ▼ Pyodide の仮想ファイルに fight.py を書き込む
pyodide.FS.writeFile("fight.py", fightCode);
pyodide.FS.writeFile("skill.py", skillCode);

// ▼ start_game.py を読み込む
const code = await (await fetch("start_game.py")).text();


try {
    await pyodide.runPythonAsync(code);
    console.log("start_game.py executed");
} catch (e) {
    console.error("start_game.py error:", e);
}

// ▼ JSON を JS で取得
const stageData = await (await fetch(`get_stage/${stageName}.json`)).json();
// ▼ ローカルストレージから永続ステータスを取得
const playerData = JSON.parse(localStorage.getItem("playerData"));
const permAtk = playerData.perm_stats.atk_bonus;
const permHp  = playerData.perm_stats.hp_bonus;
const permReroll  = playerData.perm_stats.reroll_bonus;

// ▼ Python に渡す
pyodide.globals.set("stage_data", stageData);
pyodide.globals.set("perm_atk_bonus", permAtk);
pyodide.globals.set("perm_hp_bonus", permHp);
pyodide.globals.set("perm_reroll_bonus", permReroll);

// ▼ Python の関数を取得
//const init_game = pyodide.globals.get("init_game");

// ▼ 最後に init_game を呼ぶ
pyodide.runPython(`init_game("${stageName}")`);
//init_game(stageName);

</script>


<script>

//ここからは初期設定を行っているところ

let diceFaces = [
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6]
];

let diceValues = [1,2,3,4,5];

let enemyHP = [];
let enemyMaxHP = [];

let rerollLeft = 3;
let rerollLeft_max = 3;

let targetIndex = -1; // -1 = 対象未選択

window.enemyMaxHP = null;

window.playerHP = 0;
window.playerMaxHP = 0;

let currentExp = 0;
const expMax = 5;

let inputLocked = false;

//pythonが関係している奴は大体window.イベント名(初期化は含まず)
window.register_events = () => {
    for (let i = 0; i < 5; i++) {
        document.getElementById("dice-" + i)
            .addEventListener("click", () => rerollDice(i));
    }

    //攻撃ボタンだyo
    document.getElementById("attack-button")
        .addEventListener("click", onAttackButton);

    //メニューボタン関連はここから
    document.getElementById("menu")
        .addEventListener("click", () => {
            const ui = document.getElementById("pause-menu");
            ui.classList.remove("hidden");
            ui.classList.add("show");
        });
    //再開する
    document.getElementById("pause-resume")
        .addEventListener("click", () => {
            document.getElementById("pause-menu").classList.remove("show");
        });
    //中断する
    document.getElementById("pause-save")
        .addEventListener("click", () => {
        // Python から中断データを受け取る
        const paused_json = pyodide.runPython("put_json_data()");
        const paused = JSON.parse(paused_json);

        // 中断データを保存して、stage.htmlに戻る
        localStorage.setItem("paused_data", JSON.stringify(paused));
        document.getElementById("pause-menu").classList.remove("show");
        window.location.href = "stage.html";
        });
    //諦める
    document.getElementById("pause-giveup")
        .addEventListener("click", () => {
            window.location.href = "stage.html";
        });
};

window.startTurnJS = function(values) {
    // Pythonから来たサイコロの値を反映する
    animateAllDice(values);   // ← これでサイコロ画像が更新される
    recalcDamage();           // ← ダメージ計算も更新される
    enableTurnControls();     // ← 攻撃ボタンとサイコロを有効化
};

//一応ダイスの出目を保存
function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}
//レベルの設定
function setLevel(lv) {
    document.getElementById("level-display").textContent = "レベル " + lv;
}
//waveの設定
function setWave(w, max) {
    document.getElementById("wave-display").textContent = w + "/" + max;
}
//expバーの設定
function setExp(exp, expMax) {
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}
//プレイヤーの現在体力を編集
window.setPlayerHP = function(hp) {
    window.playerHP = hp;
    updatePlayerHP(hp);         // HPバー更新
};
//プレイヤーの最大体力を編集
window.setPlayerMaxHP = function(maxHp) {
    window.playerMaxHP = maxHp;  // ★ 初期化時だけ呼ぶ
    updatePlayerHP(maxHp);
};
//リロールできる最大値を保存
function setRerollMax(n) {
    rerollLeft = n;
    rerollLeft_max = rerollLeft
    updateRerollCounter();
}


//敵の攻撃間隔をここで表示
window.enemyInterval = [];
window.enemyIntervalMax = [];

window.setEnemyInterval = function(list) {
    window.enemyInterval = [...list];
    window.enemyIntervalMax = [...list];

    for (let i = 0; i < list.length; i++) {
        const el = document.getElementById(`enemy-interval-${i}`);
        if (el) el.textContent = `あと ${list[i]}`;
    }
};

//攻撃ボタンが押されたらfight.pyの関数を呼ぶ
window.onAttackButton = function() {
    if (inputLocked) return;

    pyodide.runPython("on_attack_button()");
};

//サイコロ関係は以下

function rollDice(index) {
    const faces = diceFaces[index];
    const result = faces[Math.floor(Math.random() * faces.length)];
    diceValues[index] = result;
    const img = document.getElementById("dice-" + index);
    img.classList.add("dice-roll");
    setTimeout(() => img.classList.remove("dice-roll"), 200);
    return result;
}
//サイコロの簡単な演出
function animateAllDice(values) {
    values = values.toJs();
    diceValues = values;

    for (let i = 0; i < diceValues.length; i++) {
        const img = document.getElementById("dice-" + i);

        // 出目を更新
        img.src = "picture/dice" + diceValues[i] + ".png";

        // アニメーション付与(回転するよ)
        img.classList.add("dice-roll");
        setTimeout(() => img.classList.remove("dice-roll"), 200);
    }
}
//サイコロの出目を表示
function recalcDamage() {
    const result = pyodide.runPython(`
from fight import calc_damage
calc_damage(${JSON.stringify(diceValues)})
    `);

    const [dmg, mult, role] = result.toJs();

    window.lastDamageValue = dmg;
    showDamageInfo(dmg, mult, role);
}
//サイコロを振りなおす
window.rerollDice = function(index) {
    console.log("rerollDice called", index);
    if (inputLocked) return;
    if (rerollLeft <= 0) return;

    rerollLeft--;
    updateRerollCounter();

    const result = rollDice(index);
    diceValues[index] = result;
    document.getElementById("dice-" + index).src =
        "picture/dice" + result + ".png";

    recalcDamage();
};
//ターン終了時、サイコロのリロール回数を初期化
window.resetReroll = function() {
    rerollLeft = rerollLeft_max;
    updateRerollCounter();
};
//サイコロの画像を設定させる
function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}
//振りなおす度に、あと何回振りなおせるかを表示
function updateRerollCounter() {
    document.getElementById("reroll-counter").textContent =
        `残り ${rerollLeft} 回`;
}

//サイコロの枠に色を付ける
function highlightDice(values, color_value, role) {

    // まず全部リセット
    for (let i = 0; i < values.length; i++) {
        const d = document.getElementById(`dice-${i}`);
        d.style.border = "none";
    }

    console.log(color_value)

    // 役に関係するサイコロだけ枠色を付ける
    for (let i = 0; i < values.length; i++) {
        const d = document.getElementById(`dice-${i}`);
        if (role === "ツーペア"){
            if(values[i] !== color_value){
                d.style.border = "4px solid red";
                d.style.borderRadius = "8px";
            }
        }else if(color_value === 10){
            d.style.border = "4px solid red";
            d.style.borderRadius = "8px";
        }else if (values[i] === color_value) {
            d.style.border = "4px solid red";
            d.style.borderRadius = "8px";
        }
    }
}

//ここでは敵の並び方を設定

function setEnemy(enemyCount) {
    const area = document.getElementById("enemy-area");
    area.innerHTML = "";

    const main = document.getElementById("main-area");
    main.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

    if (enemyCount === 1) main.classList.add("enemy-layout-1");
    else if (enemyCount === 2) main.classList.add("enemy-layout-2");
    else if (enemyCount === 3) main.classList.add("enemy-layout-3");

    // ★ 敵枠を生成する
    for (let i = 0; i < enemyCount; i++) {
        const box = document.createElement("div");
        box.className = "enemy-box";
        box.id = `enemy-${i}`;

        box.addEventListener("click", () => {
            window.currentTargetIndex = i;   // ← 攻撃対象の番号を保存
            highlightTarget(i);              // ← 見た目を変える
        });

        // 画像タグ（後で JSON の画像をセットする）
        const img = document.createElement("img");
        img.className = "enemy-img";
        img.id = `enemy-img-${i}`;
        img.src = ""; // 初期は空

        // ターゲット表示
        const target = document.createElement("div");
        target.className = "enemy-target";

        const hpArea = document.createElement("div");
        hpArea.className = "enemy-hp-area";

        const hpBar = document.createElement("div");
        hpBar.className = "hp-bar";

        // HPバー
        const hpFill = document.createElement("div");
        hpFill.className = "enemy-hp-fill";
        hpFill.id = `enemy-hp-fill-${i}`;

        hpBar.appendChild(hpFill);
        hpArea.appendChild(hpBar);

        // ★ HPテキスト（数字）
        const hpText = document.createElement("div");
        hpText.className = "hp-text";
        hpText.id = `enemy-hp-text-${i}`;
        hpText.textContent = "0 / 0";

        hpArea.appendChild(hpText);

        const intervalText = document.createElement("div");
        intervalText.className = "enemy-interval";
        intervalText.id = `enemy-interval-${i}`;
        intervalText.textContent = "";

        box.appendChild(target);
        box.appendChild(img);
        box.appendChild(hpArea);
        box.appendChild(intervalText);

        area.appendChild(box);
    }
}


window.setEnemyCount = function(count) {
    setEnemy(count);  // ← 敵の枠を作る（今まで通り）

    window.enemyMaxHP = null;

    window.enemyCount = count;

    // ★ 敵クリックイベントを登録する
    for (let i = 0; i < count; i++) {
        const el = document.getElementById(`enemy-${i}`);
        el.addEventListener("click", () => {
            window.currentTargetIndex = i;
            highlightTarget(i);
        });
    }
};

//レベル関係は以下

function addExp(amount) {
    exp += amount;
    if (exp >= expMax) {
        exp -= expMax;
        level++;
        document.getElementById("level-display").textContent = "レベル " + level;
    }
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
}

window.setEnemyHP = function(hpList) {

    // ★ 初回だけ最大HPを保存する
    if (!window.enemyMaxHP || window.enemyMaxHP.length !== hpList.length) {
        window.enemyMaxHP = [...hpList];
    }


    enemyHP = hpList;

    for (let i = 0; i < hpList.length; i++) {
        const hp = hpList[i];
        const maxHp = window.enemyMaxHP[i];

        const fill = document.getElementById(`enemy-hp-fill-${i}`);
        const text = document.getElementById(`enemy-hp-text-${i}`);

        if (fill) {
            const ratio = hp / maxHp;
            fill.style.width = (ratio * 100) + "%";
        }

        if (text) {
            text.textContent = `${hp} / ${maxHp}`;
        }
    }
};

window.setEnemyImages = function(imgList) {
    for (let i = 0; i < imgList.length; i++) {
        const img = document.getElementById(`enemy-img-${i}`);
        if (img) img.src = imgList[i];
    }
    updatePlayerHP();
};

window.updateEnemyImages = function(index, enemyDataList) {
    const img = document.getElementById(`enemy-img-${index}`);
    if (!img) return;

    img.src = enemyDataList[index];
};

function updateEnemyHPUI() {
    for (let i = 0; i < enemyHP.length; i++) {
        const percent = (enemyHP[i] / enemyMaxHP[i]) * 100;
        document.getElementById(`enemy-hp-${i}`).style.width = percent + "%";

        document.getElementById(`enemy-hp-text-${i}`).textContent =
            `${enemyHP[i]} / ${enemyMaxHP[i]}`;
    }
}

//以下は攻撃系

function showDamageInfo(dmg, mult, role) {
    const info = document.getElementById("damage-info");
    info.textContent = `${dmg} ダメージ (${mult}倍 - ${role})`;
}

window.getDamageValue = function() {
    return lastDamageValue; // recalcDamageでセットしておく
};

//ターゲットの指定
window.currentTargetIndex = -1;

window.getTargetIndex = function() {
    return window.currentTargetIndex ?? -1;
};

//ターゲットの切り替え
function highlightTarget(index) {
    for (let i = 0; i < enemyCount; i++) {
        const el = document.getElementById(`enemy-${i}`);
        const targetText = el.querySelector(".enemy-target");

        if (i === index) {
            el.classList.add("targeted");
            targetText.textContent = "target!";
        } else {
            el.classList.remove("targeted");
            targetText.textContent = "";
        }
    }
}

//UIの有効化
window.enableTurnControls = function() {
    const attack = document.getElementById("attack-button");
    attack.disabled = false;
    attack.classList.add("enabled");

    // サイコロも有効化
    for (let i = 0; i < 5; i++) {
        document.getElementById("dice-" + i).classList.remove("disabled");
    }
};

window.disableTurnControls = function() {
    const attack = document.getElementById("attack-button");
    attack.disabled = true;
    attack.classList.remove("enabled");

    for (let i = 0; i < 5; i++) {
        document.getElementById("dice-" + i).classList.add("disabled");
    }
};

window.updateEnemyInterval = function(index, value) {
    const el = document.getElementById(`enemy-interval-${index}`);
    if (el) el.textContent = `あと ${value}`;
};

function updatePlayerHP(hp) {
    playerHP = hp;
    const fill = document.getElementById("player-hp-fill");
    const text = document.getElementById("player-hp-text");

    const ratio = playerHP / playerMaxHP;
    fill.style.width = (ratio * 100) + "%";
    text.textContent = `${playerHP} / ${playerMaxHP}`;
}

/*ここからは演出関連*/
//wave開始時に画面真ん中にwave〇〇と表示
function showWaveStart(wave) {
    const banner = document.getElementById("wave-banner");
    banner.textContent = `Wave ${wave}`;
    banner.classList.add("show");

    setTimeout(() => {
        banner.classList.remove("show");
    }, 1500);
}
//攻撃した敵がちょっと点滅
function enemyHitEffect(index) {
    const box = document.getElementById(`enemy-${index}`);
    box.classList.add("enemy-hit");

    setTimeout(() => {
        box.classList.remove("enemy-hit");
    }, 150);
}
//ダメージの表示
function showDamage(index, dmg) {
    const box = document.getElementById(`enemy-${index}`);

    const popup = document.createElement("div");
    popup.className = "damage-popup";
    popup.textContent = `-${dmg}`;

    box.appendChild(popup);

    setTimeout(() => popup.remove(), 600);
}

//斬撃エフェクト
function slashEffect(index) {
    const box = document.getElementById(`enemy-${index}`);
    const slash = document.createElement("div");
    slash.className = "slash-effect";

    box.appendChild(slash);

    setTimeout(() => slash.remove(), 200);
}

//敵消すよ
function killEnemy(index) {
    const enemyEl = document.getElementById(`enemy-${index}`);

    enemyEl.style.visibility = "hidden";
    enemyEl.style.pointerEvents = "none";
}

//ここからはスキルの選択について
function startSkillSelect(count) {
    // ① 戦闘停止
    inputLocked = true;

    // ② 選ぶ回数を記録
    pendingSkillCount = count;

    // ③ Pythonにスキル候補を要求
    const skills = pyodide.runPython("get_skill_choices()");

    // ④ UIに表示
    showSkillSelectUI(skills);
}

function onSkillSelected(skillId) {
    pyodide.runPython(`apply_skill(${skillId})`);
    pendingSkillCount--;

    if (pendingSkillCount <= 0) {
        const container = document.getElementById("skill-select-container");
        inputLocked = false;
        container.classList.add("hidden");
        pyodide.runPython("start_wave()");  // ← ここで初めて次ウェーブ
    } else {
        const skills = pyodide.runPython("get_skill_choices()");
        showSkillSelectUI(skills);
    }
}

function showSkillSelectUI(skills) {
    const container = document.getElementById("skill-select-container");
    container.classList.remove("hidden");

    for (let i = 0; i < 3; i++) {
        const slot = document.getElementById(`skill-slot-${i+1}`);

        // ★ PyProxy → Map に変換（toJs() のデフォルト）
        const skill = skills[i].toJs();

        // Map なので get() を使う なんかjsオブジェクトにできなかった...mapで取れたからよし
        const id = skill.get("id");
        const name = skill.get("name");
        const type = skill.get("type");
        const value = skill.get("value");
        const rarity = skill.get("rarity");

        let titleText = id >= 100 ? "特殊スキル" : "ステータス強化";

        slot.classList.remove("skill-green", "skill-blue", "skill-purple", "skill-yellow");
        slot.classList.add(`skill-${rarity}`);

        slot.onclick = null;

        slot.innerHTML = `
            <div class="skill-title">${titleText}</div>
            <div class="skill-detail">${name}</div>
        `;

        slot.onclick = () => {
            onSkillSelected(id);
        };
    }
}

function onExpGained(amount) {
    if (inputLocked) return;
    let oldExp = currentExp;
    let newExp = currentExp + amount;

    // レベルアップしない場合
    if (newExp < expMax) {
        animateExpBar(oldExp, newExp);
        currentExp = newExp;
        return;
    }

    // --- レベルアップが起きる場合 ---
    // ① expMax まで伸ばす
    animateExpBar(oldExp, expMax);

    // ② レベルアップ演出
    showLevelUpEffect();

    // ③ 次のレベルの残り経験値を計算
    const overflow = newExp - expMax;

    // ④ バーを0に戻す（瞬間的に）
    setTimeout(() => {
        const bar = document.getElementById("exp-fill");
        bar.style.transition = "none";
        bar.style.width = "0%";

        // ⑤ 0 → overflow に伸ばす
        setTimeout(() => {
            animateExpBar(0, overflow);
        }, 50);
    }, 300);

    currentExp = overflow;
}

function animateExpBar(fromExp, toExp) {
    const bar = document.getElementById("exp-fill");

    const fromPercent = (fromExp / expMax) * 100;
    const toPercent = (toExp / expMax) * 100;

    bar.style.transition = "width 0.3s ease";
    bar.style.width = `${toPercent}%`;
}


//永続的なレベルの保存処理
function addPermanentExp(amount) {
    const data = JSON.parse(localStorage.getItem("playerData"));

    // 経験値加算
    data.perm_exp += amount;

    // レベルアップ判定
    while (data.perm_exp >= data.perm_next_exp) {
        data.perm_exp -= data.perm_next_exp;
        data.perm_level += 1;
        data.perm_next_exp += 1;  // 必要経験値が +1 ずつ増える

        // 永続ステータス上昇（レベルアップ時）
        data.perm_stats.atk_bonus += 5;
        data.perm_stats.hp_bonus += 10;

        if (data.perm_level % 10 === 0) {
            data.perm_stats.reroll_bonus += 1;
        }
    }

    // 保存
    localStorage.setItem("playerData", JSON.stringify(data));
}

function showStageClear(expGained) {
    const ui = document.getElementById("stageClearUI");
    const diceWrapper = document.getElementById("dice-wrapper");
    const attackButton = document.getElementById("attack-button");
    const menu = document.getElementById("menu");

    menu.style.pointerEvents = "none";
    diceWrapper.style.pointerEvents = "none";
    attackButton.style.pointerEvents = "none";

    ui.querySelector(".clear-exp").textContent =
        `入手経験値：exp + ${expGained}`;

    ui.classList.remove("hidden");
    ui.classList.add("show");

    document.getElementById("returnButton").onclick = () => {
        // ステージ選択画面へ戻る
        window.location.href = "stage.html";
    };
}

function showGameOver() {
    const ui = document.getElementById("gameOverUI");
    const diceWrapper = document.getElementById("dice-wrapper");
    const attackButton = document.getElementById("attack-button");
    const menu = document.getElementById("menu");

    menu.style.pointerEvents = "none";
    diceWrapper.style.pointerEvents = "none";
    attackButton.style.pointerEvents = "none";

    ui.querySelector(".gameover-text").textContent = "ゲームオーバー...";

    ui.classList.remove("hidden");
    ui.classList.add("show");

    document.getElementById("gameOverReturnButton").onclick = () => {
        window.location.href = "stage.html";
    };
}
