<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ← スクロール禁止 */
            height: 100%;
            font-family: sans-serif;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ddd;
            font-size: 20px;
            font-weight: bold;
            height: 60px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 60px - 140px); 
            /* 100vh - 上部60px - 下部140px */
        }

        /* 左側ステータス */
        #left-status {
            padding: 10px;
            width: 180px;
            box-sizing: border-box;
            font-size: 18px;
        }

        #exp-bar {
            width: 100%;
            height: 16px;
            background: #bbb;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        #exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* メインエリア（敵） */
        #main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .enemy-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
        }

        /* 下部サイコロエリア */
        #dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #eee;
            height: 140px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        .dice-box {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .enemy-layout-1 {
            justify-content: center;
        }

        .enemy-layout-2 {
            justify-content: space-around;
        }

        .enemy-layout-3 {
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div>1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
        <div id="left-status">
            <div>レベル </div>
            <div id="exp-bar">
                <div id="exp-fill"></div>
            </div>
        </div>

        <!-- メインエリア（敵） -->
        <div id="main-area">
            <div class="enemy-box">敵1</div>
            <div class="enemy-box">敵2</div>
        </div>

    </div>

    <!-- 下部サイコロ -->
    <div id="dice-area">
        <div class="dice-box">サイコロ1</div>
        <div class="dice-box">サイコロ2</div>
        <div class="dice-box">サイコロ3</div>
        <div class="dice-box">サイコロ4</div>
        <div class="dice-box">サイコロ5</div>
    </div>

</body>
<script>
    function setEnemyLayout(enemyCount) {
        const area = document.getElementById("main-area");

        area.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

        if (enemyCount === 1) {
            area.classList.add("enemy-layout-1");
        } else if (enemyCount === 2) {
            area.classList.add("enemy-layout-2");
        } else if (enemyCount === 3) {
            area.classList.add("enemy-layout-3");
        }
    }

    function addExp(amount) {
    exp += amount;
        if (exp >= expMax) {
            exp -= expMax;
            level++;
            document.getElementById("level-display").textContent = "レベル " + level;
        }
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
    }
</script>
</html>
