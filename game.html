<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ゲーム進行画面</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* ← スクロール禁止 */
            height: 100%;
            font-family: sans-serif;
        }

        /* 上部バー */
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #ddd;
            font-size: 20px;
            font-weight: bold;
            height: 60px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        /* 全体レイアウト */
        #content {
            display: flex;
            height: calc(100vh - 60px - 140px); 
            /* 100vh - 上部60px - 下部140px */
        }

        /* 左側ステータス */
        #left-status {
            padding: 10px;
            width: 180px;
            box-sizing: border-box;
            font-size: 18px;
        }

        #exp-bar {
            width: 100%;
            height: 16px;
            background: #bbb;
            border-radius: 8px;
            margin-top: 8px;
            overflow: hidden;
        }

        #exp-fill {
            width: 0%;
            height: 100%;
            background: #4caf50;
        }

        /* メインエリア（敵） */
        #main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .enemy-box {
            width: 160px;
            height: 160px;
            background: white;
            border: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            border-radius: 10px;
        }

        /* 下部サイコロエリア */
        #dice-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 10px;
            background: #eee;
            height: 140px; /* ← 高さ固定 */
            box-sizing: border-box;
        }

        .dice-box {
            width: 100px;
            height: 100px;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
        .enemy-layout-1 {
            justify-content: center;
        }

        .enemy-layout-2 {
            justify-content: space-around;
        }

        .enemy-layout-3 {
            justify-content: space-between;
        }
        .enemy-box {
            width: 120px;
            text-align: center;
        }

        .hp-bar {
            width: 100%;
            height: 12px;
            background: #444;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px;
        }

        .hp-fill {
            height: 100%;
            background: #e74c3c;
            width: 100%;
            transition: width 0.3s;
        }

    </style>
</head>
<body>

    <!-- 上部バー -->
    <div id="top-bar">
        <div id="wave">
            <div>wave</div>
            <div>1/10</div>
        </div>

        <div>ゲーム進行画面</div>

        <div id="menu">メニュー</div>
    </div>

    <!-- 左ステータス + メインエリア -->
    <div id="content">

        <!-- 左側ステータス -->
        <div id="left-status">
            <div>レベル </div>
            <div id="exp-bar">
                <div id="exp-fill"></div>
            </div>
        </div>

        <!-- メインエリア（敵） -->
    <div id="main-area">
        <div id="enemy-area"></div>
    </div>

    </div>

    <!-- 下部サイコロ -->
    <div id="dice-area">
        <img class="dice-box" id="dice-0" onclick="rerollDice(0)" src="picture/dice1.png">
        <img class="dice-box" id="dice-1" onclick="rerollDice(1)" src="picture/dice2.png">
        <img class="dice-box" id="dice-2" onclick="rerollDice(2)" src="picture/dice3.png">
        <img class="dice-box" id="dice-3" onclick="rerollDice(3)" src="picture/dice4.png">
        <img class="dice-box" id="dice-4" onclick="rerollDice(4)" src="picture/dice5.png">
    </div>

</body>
<script>

let diceFaces = [
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6],
    [1,2,3,4,5,6]
];

let diceValues = [1,2,3,4,5];

let enemyHP = [];
let enemyMaxHP = [];

function setDiceFaces(faces) {
    diceFaces = faces;
    updateDiceUI();
}

function setLevel(lv) {
    document.getElementById("level-display").textContent = "レベル " + lv;
}

function setWave(w, max) {
    document.getElementById("wave").textContent = w + "/" + max;
}

function setEnemyCount(n) {
    setEnemyLayout(n);
}

    //サイコロ関係は以下

    function rollDice(index) {
        const faces = diceFaces[index];
        const result = faces[Math.floor(Math.random() * faces.length)];
        diceValues[index] = result;
        return result;
    }

    function rerollDice(index) {
        const result = rollDice(index);
        document.getElementById("dice-" + index).src = "picture/dice" + result + ".png";
    }

    function updateDiceUI() {
        for (let i = 0; i < diceValues.length; i++) {
            const value = diceValues[i];
            document.getElementById("dice-" + i).src = "picture/dice" + value + ".png";
        }
    }

    function setDiceFaces(faces) {
        diceFaces = faces;
        updateDiceUI();
    }

    //ここでは敵の並び方を設定

    function setEnemy(enemyCount) {
        const area = document.getElementById("main-area");

        area.classList.remove("enemy-layout-1", "enemy-layout-2", "enemy-layout-3");

        if (enemyCount === 1) {
            area.classList.add("enemy-layout-1");
        } else if (enemyCount === 2) {
            area.classList.add("enemy-layout-2");
        } else if (enemyCount === 3) {
            area.classList.add("enemy-layout-3");
        }
    }

    //レベル関係は以下

    function addExp(amount) {
    exp += amount;
        if (exp >= expMax) {
            exp -= expMax;
            level++;
            document.getElementById("level-display").textContent = "レベル " + level;
        }
    document.getElementById("exp-fill").style.width = (exp / expMax * 100) + "%";
    }

    function setEnemyHP(hpList) {
    enemyHP = hpList;
    enemyMaxHP = [...hpList]; // 最大HPとして保存

    renderEnemyUI();
    }

function renderEnemyUI() {
    const area = document.getElementById("main-area");
    area.innerHTML = ""; // 初期化

    for (let i = 0; i < enemyHP.length; i++) {
        const box = document.createElement("div");
        box.className = "enemy-box";

        box.innerHTML = `
            <div class="enemy-name">敵${i+1}</div>
            <div class="hp-bar">
                <div class="hp-fill" id="enemy-hp-${i}"></div>
            </div>
        `;

        area.appendChild(box);
    }

    updateEnemyHPUI();
    setEnemy(enemyHP.length);
    }


    function updateEnemyHPUI() {
        for (let i = 0; i < enemyHP.length; i++) {
            const percent = (enemyHP[i] / enemyMaxHP[i]) * 100;
            document.getElementById(`enemy-hp-${i}`).style.width = percent + "%";
        }
    }

</script>
</html>
