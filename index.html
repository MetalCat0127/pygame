<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Game</title>
    <style>
        html,body{
            overflow: hidden;
        }
        h1{
            background-color:white;
            font-size:40px;
        }
        body {
            background: url('picture/sky_dice.png') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            background-repeat: no-repeat;
            background-position: center center;
            font-family: sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        #title {
            margin-top: 150px;
        }
        #startBtn {
            padding: 10px 60px;
            font-size: 30px;
            cursor: pointer;
            width: 400px;
            height: 100px;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

<div id="title">
    <h1>My Game</h1>
    <br><br>
    <button id="startBtn">START</button>
    <br><br><br>
    <button id="startBtn">説明書</button>
</div>

<iframe id="gameFrame" src="game.html"></iframe>

<script>
document.getElementById("startBtn").onclick = () => {
    document.getElementById("title").style.display = "none";
    document.getElementById("gameFrame").style.display = "block";
};
</script>

</body>
</html>
