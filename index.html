<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Game</title>
    <style>
        html,body{
            overflow: hidden;
        }
        h1{
            font-size:40px;
        }
        .span_h1 {
            background-color: white;
        }
        body {
            background: url('picture/sky_dice.png') no-repeat center center fixed;
            background-size: cover;
            text-align: center;
            background-repeat: no-repeat;
            background-position: center center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            min-height: 100vh;
            margin: 0;
        }
        #title {
            margin-top: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            margin-top: 0;

            background: rgba(255,255,255,0.5);
            padding: 40px 60px;
            border-radius: 20px;               
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        #startBtn {
            padding: 10px 60px;
            font-size: 30px;
            cursor: pointer;
            width: 400px;
            height: 100px;
            gap: 20px;
        }
        #Explanation {
            padding: 10px 60px;
            font-size: 30px;
            cursor: pointer;
            width: 400px;
            height: 100px;
            gap: 20px;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>

<div id="title">
    <h1><span_h1>コロコロサイコロ</span_h1></h1>
    <button id="startBtn">START</button>
    <button id="Explanation">説明書</button>
</div>

<script>
document.getElementById("startBtn").onclick = () => {
    location.href = "stage.html";
};
document.getElementById("Explanation").onclick = () => {
    location.href = "Explanation.html";
};
</script>

</body>
</html>
